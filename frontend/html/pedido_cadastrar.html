<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Pedido</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/config.js"></script>
    <script src="../js/pedido_cadastrar.js" defer></script>
</head>
<body>
    <main>
        <section class="card">
            <h2>Cadastrar Pedido</h2>
            <form id="form-pedido">
                <label for="IdUsuario">Código do Usuário:</label><br>
                <input type="number" id="IdUsuario" name="IdUsuario" required><br><br>

                <label for="valorTotal">Valor Total (R$):</label><br>
                <input type="number" step="0.01" id="valorTotal" name="valorTotal" required><br><br>

                <button type="submit" id="btn_cadastrar" class="btn">Registrar Pedido</button>
            </form>
            <div id="resposta" class="resposta"></div>
        </section>
    </main>
</body>
</html>
