<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Estoque</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/config.js"></script>
    <script src="../js/estoque_cadastrar.js" defer></script>
</head>
<body>
    <main>
        <section class="card">
            <h2>Cadastrar Estoque</h2>
            <form id="form-estoque">
                <label for="idProduto">Código do Produto:</label><br>
                <input type="number" id="idProduto" name="idProduto" required><br><br>

                <label for="quantidadeDisponivel">Quantidade Disponível:</label><br>
                <input type="number" id="quantidadeDisponivel" name="quantidadeDisponivel" min="0" required><br><br>

                <button type="submit" id="btn_cadastrar" class="btn">Cadastrar Estoque</button>
            </form>
            <div id="resposta" class="resposta"></div>
        </section>
    </main>
</body>
</html>
