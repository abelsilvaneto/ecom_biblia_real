<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Categoria</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/config.js"></script>
    <script src="../js/categoria_atualizar.js" defer></script>
</head>
<body>
    <main>
        <section class="card">
            <h2>Atualizar Categoria</h2>
            <form id="form-atualizar">
                <label for="id">ID da Categoria:</label><br>
                <input type="number" id="id" name="id" required><br><br>

                <label for="nome">Novo Nome:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>

                <button type="submit" id="btn_atualizar" class="btn">Atualizar</button>
            </form>
            <div id="resposta" class="resposta"></div>
        </section>
    </main>
</body>
</html>
