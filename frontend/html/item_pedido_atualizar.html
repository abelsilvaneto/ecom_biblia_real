<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Item do Pedido</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/config.js"></script>
    <script src="../js/item_pedido_atualizar.js" defer></script>
</head>
<body>
    <main>
        <section class="card">
            <h2>Atualizar Item do Pedido</h2>
            <form id="form-atualizar">
                <label for="id">ID do Item:</label><br>
                <input type="number" id="id" name="id" required><br><br>

                <label for="Idpedido">Código do Pedido:</label><br>
                <input type="number" id="Idpedido" name="Idpedido" required><br><br>

                <label for="Idproduto">Código do Produto:</label><br>
                <input type="number" id="Idproduto" name="Idproduto" required><br><br>

                <label for="quantidade">Quantidade:</label><br>
                <input type="number" id="quantidade" name="quantidade" min="1" required><br><br>

                <label for="precoUnitario">Preço Unitário (R$):</label><br>
                <input type="number" step="0.01" id="precoUnitario" name="precoUnitario" required><br><br>

                <button type="submit" id="btn_atualizar" class="btn">Atualizar Item</button>
            </form>
            <div id="resposta" class="resposta"></div>
        </section>
    </main>
</body>
</html>
