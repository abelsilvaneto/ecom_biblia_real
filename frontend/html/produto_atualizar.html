<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Produto</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/config.js"></script>
    <script src="../js/produto_atualizar.js" defer></script>
</head>
<body>
    <main>
        <section class="card">
            <h2>Atualizar Produto</h2>
            <form id="form-atualizar">
                <label for="id">ID do Produto:</label><br>
                <input type="number" id="id" name="id" required><br><br>

                <label for="titulo">Título:</label><br>
                <input type="text" id="titulo" name="titulo" required><br><br>

                <label for="traducao">Tradução / Descrição:</label><br>
                <input type="text" id="traducao" name="traducao" required><br><br>

                <label for="preco">Preço (R$):</label><br>
                <input type="number" step="0.01" id="preco" name="preco" required><br><br>

                <label for="IdCategoria">Código da Categoria:</label><br>
                <input type="number" id="IdCategoria" name="IdCategoria" required><br><br>

                <label for="imagem">URL da Imagem:</label><br>
                <input type="text" id="imagem" name="imagem"><br><br>

                <button type="submit" id="btn_atualizar" class="btn">Atualizar Produto</button>
            </form>
            <div id="resposta" class="resposta"></div>
        </section>
    </main>
</body>
</html>
