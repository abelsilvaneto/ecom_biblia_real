<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Usuário</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/config.js"></script>
    <script src="../js/usuario_atualizar.js" defer></script>
</head>
<body>
    <main>
        <section class="card">
            <h2>Atualizar Usuário</h2>
            <form id="form-atualizar">
                <label for="id">ID do Usuário:</label><br>
                <input type="number" id="id" name="id" required><br><br>

                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="senha">Nova Senha:</label><br>
                <input type="password" id="senha" name="senha" required><br><br>

                <label for="cpf">CPF:</label><br>
                <input type="text" id="cpf" name="cpf" maxlength="11" required><br><br>

                <button type="submit" id="btn_atualizar" class="btn">Atualizar</button>
            </form>
            <div id="resposta" class="resposta"></div>
        </section>
    </main>
</body>
</html>
